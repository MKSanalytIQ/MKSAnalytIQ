<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MKSANALYTIQ — Build Digital. Grow Smarter.</title>
  <desc id="desc">A bright blue and violet studio scene with a floating analytics panel and layered glass-like cards.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5ff"/>
